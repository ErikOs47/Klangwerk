<title>Klangwerk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: Logic-Fenster in drei Ebenen. Steuerleiste oben, Arrangement mit Spurköpfen links, Editor unten. */
:root {
  --bg: #16171b;
  --panel: #202127;
  --panel-2: #292b32;
  --raise: #353741;
  --line: #3a3d47;
  --fg: #e7e8ed;
  --muted: #8e92a2;
  --accent: #f2b84b;
  --rec: #ff5a52;
  --mute: #5aa0ff;
  --solo: #f2d64b;
  --lcd: #0e1115;
  --lcd-fg: #cfe1ff;
  --font-ui: "Barlow", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --hw: 232px;
  --row: 72px;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; overflow: hidden; user-select: none; -webkit-user-select: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
@media (max-width: 700px) { :root { --hw: 150px; } }

#app { height: 100%; display: flex; flex-direction: column; }

/* ---------- Steuerleiste ---------- */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--panel); border-bottom: 1px solid #000; }
.brand { font-weight: 700; letter-spacing: .04em; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.brand i { width: 14px; height: 14px; border-radius: 3px; background: conic-gradient(var(--accent), var(--rec), var(--mute), var(--accent)); display: inline-block; }
.group { display: flex; align-items: center; gap: 4px; }
.tbtn { height: 30px; min-width: 34px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel-2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; }
.tbtn:hover { background: var(--raise); }
.tbtn svg { width: 15px; height: 15px; fill: currentColor; }
.tbtn.on { background: var(--accent); color: #1b1400; border-color: var(--accent); }
.tbtn.rec { color: var(--rec); }
.tbtn.rec.on { background: var(--rec); color: #fff; border-color: var(--rec); }
.tbtn.play.on { background: #3fb969; border-color: #3fb969; color: #06210f; }
.lcd { display: flex; align-items: stretch; background: var(--lcd); border: 1px solid #000; border-radius: 8px; padding: 3px 4px; font-family: var(--font-mono); color: var(--lcd-fg); box-shadow: inset 0 1px 6px #000a; }
.lcd > div { padding: 0 12px; display: flex; flex-direction: column; justify-content: center; border-right: 1px solid #222832; }
.lcd > div:last-child { border-right: 0; }
.lcd small { font-family: var(--font-ui); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: #6f7c92; }
.lcd b { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.lcd input { width: 54px; background: transparent; border: 0; font-family: var(--font-mono); font-size: 19px; font-weight: 600; color: var(--lcd-fg); padding: 0; }
.spacer { flex: 1; }
.menu-wrap { position: relative; }
.menu { position: absolute; top: 36px; left: 0; z-index: 50; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 4px; min-width: 210px; box-shadow: 0 10px 30px #0008; }
.menu button { display: flex; width: 100%; gap: 10px; align-items: center; text-align: left; padding: 8px 10px; border: 0; background: transparent; border-radius: 6px; }
.menu button:hover { background: var(--raise); }
.menu svg { width: 18px; height: 18px; fill: var(--muted); }
.devmenu { left: auto; right: 0; width: 290px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.devmenu[hidden] { display: none; }
.devmenu h4 { margin: 4px 0 0; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.devmenu .sbtn, .devmenu select { height: 28px; border-radius: 5px; border: 1px solid var(--line); background: var(--raise); padding: 0 8px; font-size: 13px; width: 100%; justify-content: center; }
.devlist { font-size: 13px; display: flex; flex-direction: column; gap: 3px; }
.devlist span::before { content: "●  "; color: #3fb969; }
.devnote { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.4; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); display: inline-block; }
.dot.on { background: #3fb969; }
.filemenu { left: auto; right: 0; min-width: 250px; }
.filemenu kbd { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.filemenu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.pname { font-size: 13px; color: var(--muted); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pname.dirty::after { content: " •"; color: var(--accent); }
.tabs { display: flex; gap: 2px; background: var(--bg); border-radius: 6px; padding: 2px; }
.tabs button { height: 24px; padding: 0 10px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.tabs button.on { background: var(--raise); color: var(--fg); }
.sm.eqb.on { background: color-mix(in srgb, var(--c) 45%, var(--raise)); }
/* Kanal-EQ */
.eq { position: absolute; inset: 0; display: flex; gap: 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eq-graph { position: relative; flex: 1; min-width: 0; border-radius: 6px; background: #0f1013; overflow: hidden; touch-action: none; }
.eq-graph canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.eq-bands { width: 230px; flex: none; overflow: auto; display: flex; flex-direction: column; gap: 4px; }
.band { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 5px; background: var(--panel-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.band b { font-weight: 600; }
.band span { color: var(--muted); }
.band input { margin: 0; accent-color: var(--bc); }
.band.off { opacity: .5; }
@media (max-width: 700px) { .eq { flex-direction: column; } .eq-bands { width: auto; flex-direction: row; flex-wrap: wrap; max-height: 70px; } }
.fx { position: absolute; inset: 0; overflow: auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; align-content: start; }
.card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card.shared { border-style: dashed; }
.card h3 { margin: 0 0 2px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg); }
.card h3 label { display: flex; align-items: center; gap: 6px; }
.knob { display: grid; grid-template-columns: 92px 1fr 64px; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.knob input[type=range], .knob select { min-width: 0; width: 100%; }
.knob select { grid-column: 2 / 4; height: 24px; background: var(--raise); border: 1px solid var(--line); border-radius: 4px; font-size: 12px; }
.knob output { text-align: right; color: var(--fg); font-variant-numeric: tabular-nums; }
.card .sbtn { align-self: flex-start; height: 24px; border-radius: 5px; border: 1px solid var(--line); background: var(--raise); padding: 0 10px; font-size: 12px; }
.gr { display: grid; grid-template-columns: 92px 1fr; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.gr i { height: 6px; background: #0b0c0f; border-radius: 3px; overflow: hidden; display: flex; justify-content: flex-end; }
.gr b { display: block; height: 100%; width: 0; background: var(--accent); }
.meter { width: 90px; height: 8px; border-radius: 4px; background: #0b0c0f; overflow: hidden; border: 1px solid #000; }
.meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #3fb969 0 70%, var(--solo) 70% 88%, var(--rec) 88%); background-size: 90px 100%; }
.mini { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
input[type=range] { accent-color: var(--accent); }

/* ---------- Arrangement ---------- */
.arrange { flex: 1; min-height: 120px; position: relative; background: var(--bg); }
#scroller { position: absolute; inset: 0; overflow: auto; }
#grid { position: relative; min-width: 100%; }
.ruler-row { display: flex; position: sticky; top: 0; z-index: 6; height: 30px; background: var(--panel); border-bottom: 1px solid #000; }
.corner { position: sticky; left: 0; z-index: 7; width: var(--hw); flex: none; background: var(--panel); border-right: 1px solid #000; display: flex; align-items: center; padding-left: 10px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.ruler { position: relative; flex: none; cursor: text; }
.ruler .bn { position: absolute; top: 12px; font-size: 11px; color: var(--muted); padding-left: 3px; border-left: 1px solid var(--line); height: 18px; font-variant-numeric: tabular-nums; }
.loopband { position: absolute; top: 2px; height: 9px; border-radius: 3px; background: color-mix(in srgb, var(--accent) 35%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent); }
.loopband.on { background: var(--accent); border-color: var(--accent); }
.track-row { display: flex; height: var(--row); border-bottom: 1px solid #0c0d10; }
.thead { position: sticky; left: 0; z-index: 4; width: var(--hw); flex: none; display: flex; background: var(--panel-2); border-right: 1px solid #000; }
.track-row.sel .thead { background: #353844; }
.tcolor { width: 5px; background: var(--c); flex: none; }
.tmain { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 8px; }
.trow { display: flex; align-items: center; gap: 5px; min-width: 0; }
.ticon { width: 16px; height: 16px; flex: none; fill: var(--c); }
.tname { flex: 1; min-width: 0; background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 1px 4px; font-weight: 600; }
.tname:focus { border-color: var(--line); background: var(--bg); }
.sm { height: 20px; min-width: 22px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--line); background: var(--raise); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.sm.m.on { background: var(--mute); color: #031a33; border-color: var(--mute); }
.sm.s.on { background: var(--solo); color: #2a2400; border-color: var(--solo); }
.sm.x { background: transparent; border-color: transparent; color: var(--muted); font-size: 14px; }
.sm.x:hover { color: var(--rec); }
.tsel { flex: 1; min-width: 0; height: 20px; font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; }
.tsub { font-size: 12px; color: var(--muted); }
.trow input[type=range] { min-width: 0; height: 14px; }
.trow .vol { flex: 2; }
.trow .pan { flex: 1; }
@media (max-width: 700px) { .trow .pan, .tsub { display: none; } }
.lane { position: relative; flex: none; }
.lane.sel { background: #ffffff06; }
.region { position: absolute; top: 4px; bottom: 4px; border-radius: 5px; overflow: hidden; background: color-mix(in srgb, var(--c) 38%, #101114); border: 1px solid color-mix(in srgb, var(--c) 70%, #000); cursor: grab; touch-action: none; }
.region.sel { border-color: #fff; box-shadow: 0 0 0 1px #fff; }
.region .rname { height: 16px; line-height: 16px; padding: 0 6px; font-size: 11px; font-weight: 600; color: #101114; background: var(--c); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.region canvas { position: absolute; left: 0; top: 16px; width: 100%; height: calc(100% - 16px); }
.region .rh { position: absolute; right: 0; top: 0; bottom: 0; width: 8px; cursor: ew-resize; }
.region.missing { background: repeating-linear-gradient(45deg, #2a2b30 0 6px, #232428 6px 12px); }
.region.ghost { background: color-mix(in srgb, var(--rec) 35%, #101114); border-color: var(--rec); pointer-events: none; }
.region.ghost .rname { background: var(--rec); color: #fff; }
#playhead { position: absolute; top: 0; bottom: 0; width: 1px; background: #fff; z-index: 3; pointer-events: none; }
#playhead::before { content: ""; position: absolute; top: 18px; left: -5px; border: 5px solid transparent; border-top: 7px solid #fff; }
.drop-hint { position: absolute; inset: 0; border: 2px dashed var(--accent); background: #f2b84b14; display: none; align-items: center; justify-content: center; font-size: 16px; z-index: 20; pointer-events: none; }
.arrange.dragging .drop-hint { display: flex; }

/* ---------- Editor ---------- */
.editor { height: 300px; flex: none; display: flex; flex-direction: column; background: var(--panel); border-top: 1px solid #000; }
@media (max-height: 700px) { .editor { height: 42%; } }
.ehead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid #000; background: var(--panel-2); }
.ehead h2 { margin: 0; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.ehead .rn { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; width: 150px; }
.ehead select, .ehead .sbtn { height: 26px; border-radius: 5px; border: 1px solid var(--line); background: var(--raise); padding: 0 8px; font-size: 13px; }
.ehead .note { color: var(--muted); font-size: 12px; }
.ebody { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.empty { height: 100%; overflow: auto; padding-block: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px 36px; align-content: start; color: var(--muted); }
.empty h3 { margin: 0 0 8px; color: var(--fg); font-size: 14px; }
.empty dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; font-size: 13px; }
.empty dt { font-family: var(--font-mono); color: var(--lcd-fg); font-size: 12px; }
.empty dd { margin: 0; }
.empty p { margin: 0 0 6px; max-width: 60ch; line-height: 1.45; }

/* Piano Roll */
.pr { position: absolute; inset: 0; overflow: auto; display: flex; }
.pr-keys { position: sticky; left: 0; z-index: 3; width: 58px; flex: none; background: #d9dbe2; }
.key { height: 14px; box-sizing: border-box; border-bottom: 1px solid #b4b7c2; font-size: 9px; color: #333; text-align: right; padding-right: 4px; line-height: 13px; cursor: pointer; }
.key.black { background: #23242a; border-bottom-color: #111; margin-right: 18px; color: transparent; }
.key:active, .key.down { background: var(--accent); }
.pr-grid { position: relative; flex: none; cursor: crosshair; touch-action: none; }
.pr-grid canvas { position: absolute; inset: 0; }
.nt { position: absolute; height: 13px; border-radius: 3px; background: var(--c); border: 1px solid #0008; box-sizing: border-box; cursor: grab; }
.nt.sel { outline: 1.5px solid #fff; }
.nt::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 6px; cursor: ew-resize; }
.ed-play { position: absolute; top: 0; bottom: 0; width: 1px; background: #fff; pointer-events: none; z-index: 2; }

/* Step-Sequencer */
.seq { position: absolute; inset: 0; overflow: auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.seq-row { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
.seq-name { width: 96px; flex: none; height: 24px; text-align: left; padding: 0 8px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel-2); font-size: 12px; font-weight: 600; }
.seq-name:active { background: var(--accent); color: #1b1400; }
.cells { display: flex; gap: 3px; }
.cell { width: 30px; height: 24px; border-radius: 4px; border: 1px solid #0006; background: #2d2f37; padding: 0; }
.cell.q { background: #383b45; }
.cell:nth-child(4n+1) { margin-left: 6px; }
.cell:first-child { margin-left: 0; }
.cell.on { background: color-mix(in srgb, var(--c) 70%, #000); }
.cell.acc { background: var(--c); }
.cell.now { box-shadow: inset 0 0 0 2px #fff; }
.seq-steps { display: flex; gap: 3px; margin-left: 106px; margin-bottom: 6px; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.seq-steps span { width: 30px; text-align: center; }
.seq-steps span:nth-child(4n+1) { margin-left: 6px; color: var(--fg); }
.seq-steps span:first-child { margin-left: 0; }
.wave { position: absolute; inset: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.wave canvas { width: 100%; height: 100%; border-radius: 6px; background: #101114; }

#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--raise); border: 1px solid var(--line); padding: 9px 14px; border-radius: 8px; box-shadow: 0 10px 30px #000a; z-index: 100; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .tbtn, .cell { transition: background .08s; } }
</style>

<div id="app">
  <header class="bar">
    <div class="brand"><i></i>Klangwerk</div>
    <div class="group" aria-label="Transport">
      <button class="tbtn" id="bStart" title="Zum Anfang (Enter)"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM6 8l8-6v12z"/></svg></button>
      <button class="tbtn play" id="bPlay" title="Abspielen / Stopp (Leertaste)"><svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg></button>
      <button class="tbtn" id="bStop" title="Stopp"><svg viewBox="0 0 16 16"><path d="M3 3h10v10H3z"/></svg></button>
      <button class="tbtn rec" id="bRec" title="Aufnehmen (R)"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/></svg></button>
      <button class="tbtn" id="bLoop" title="Cycle an/aus (C)"><svg viewBox="0 0 16 16"><path d="M4 5h7V3l3 3-3 3V7H4a1 1 0 0 0-1 1v1H1V8a3 3 0 0 1 3-3zm8 6H5v2l-3-3 3-3v2h7a1 1 0 0 0 1-1V8h2v1a3 3 0 0 1-3 3z"/></svg></button>
      <button class="tbtn" id="bMetro" title="Metronom"><svg viewBox="0 0 16 16"><path d="M6 1h4l3 14H3zm1.6 2L5.5 13h5L8.4 3zM8 6l4-3 .6.8-4 3z"/></svg></button>
    </div>
    <div class="lcd">
      <div><small>Takt</small><b id="lcdPos">001 1 1</b></div>
      <div><small>Tempo</small><input id="bpm" type="number" min="40" max="240" step="1" value="96" aria-label="Tempo in BPM"></div>
      <div><small>Taktart</small><b>4/4</b></div>
    </div>
    <div class="group">
      <div class="menu-wrap">
        <button class="tbtn" id="bAdd">+ Spur</button>
        <div class="menu" id="addMenu" hidden>
          <button data-add="synth"><svg viewBox="0 0 16 16"><path d="M1 3h14v10H1zm2 1v8h2V8H4V4zm3 0v4h1v4h2V8h1V4zm5 0v4h-1v4h2V4z"/></svg>Software-Instrument</button>
          <button data-add="drums"><svg viewBox="0 0 16 16"><path d="M8 3c4 0 7 1.3 7 3v5c0 1.7-3 3-7 3s-7-1.3-7-3V6c0-1.7 3-3 7-3zm0 1.5C4.7 4.5 2.5 5.4 2.5 6S4.7 7.5 8 7.5s5.5-.9 5.5-1.5S11.3 4.5 8 4.5z"/></svg>Drummer (Pattern)</button>
          <button data-add="audio"><svg viewBox="0 0 16 16"><path d="M2 7h1v2H2zm2-3h1v8H4zm2 2h1v4H6zm2-5h1v14H8zm2 3h1v8h-1zm2 2h1v4h-1z"/></svg>Audio (Mikrofon / Datei)</button>
        </div>
      </div>
      <button class="tbtn" id="bImport" title="Audiodatei importieren">Audio importieren</button>
      <input type="file" id="fileIn" accept="audio/*" hidden>
      <button class="tbtn" id="bUndo" title="Rückgängig (Strg+Z)">Rückgängig</button>
      <div class="menu-wrap">
        <button class="tbtn" id="bDev" title="MIDI-Keyboard und Audio-Eingang">Geräte <span id="midiDot" class="dot"></span></button>
        <div class="menu devmenu" id="devMenu" hidden>
          <h4>MIDI-Eingänge</h4>
          <div id="midiList" class="devlist">Noch nicht verbunden.</div>
          <button class="sbtn" id="bMidi">MIDI-Geräte verbinden</button>
          <h4>Audio-Eingang (Mikrofon / Interface)</h4>
          <select id="inSel" aria-label="Audio-Eingang"><option value="">Standardgerät</option></select>
          <button class="sbtn" id="bInScan">Eingänge suchen</button>
          <p class="devnote">Eingehende MIDI-Noten spielen auf der ausgewählten Spur und werden bei laufender Aufnahme mitgeschnitten.</p>
        </div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="group">
      <span class="pname" id="pname" title="Projektname"></span>
      <div class="menu-wrap">
        <button class="tbtn" id="bFile">Datei ▾</button>
        <div class="menu filemenu" id="fileMenu" hidden>

function drawRegion(cv, tr, r) {
  const w = cv.clientWidth, h = cv.clientHeight, dpr = devicePixelRatio || 1;

    let lo = Math.min(...r.notes.map(n => n.p)), hi = Math.max(...r.notes.map(n => n.p));
    if (hi - lo < 12) { const m = (hi + lo) / 2; lo = m - 6; hi = m + 6; }
    const rh = Math.max(2, (h - 6) / (hi - lo + 1));
    for (const n of r.notes) {
      if (n.s >= r.len) continue;
      g.fillRect(n.s * ppb, 3 + (hi - n.p) * ((h - 6 - rh) / (hi - lo || 1)), Math.max(2, Math.min(n.l, r.len - n.s) * ppb - 1), Math.min(rh, 4));
    }

    const rows = DRUMS.length, rh = (h - 4) / rows;

function drawWave(g, buf, off, dur, w, h, color) {
  const d = buf.getChannelData(0), sr = buf.sampleRate, mid = h / 2;
  const start = Math.floor(off * sr), total = Math.floor(dur * sr), per = Math.max(1, Math.floor(total / w));

    let mx = 0; const i0 = start + x * per;
    if (i0 >= d.length) break;
    for (let i = i0; i < Math.min(i0 + per, d.length); i += 4) { const v = Math.abs(d[i]); if (v > mx) mx = v; }
    const y = Math.max(.5, mx * mid * .95);
    g.fillRect(x, mid - y, 1, y * 2);

}

const EQ_COLORS = ['#ff7a6b', '#f2b84b', '#7bd88f', '#5ab4ff', '#b48af0', '#f07ad0'];

  'Gesang klar': { 0: { on: true, f: 90 }, 2: { f: 300, g: -2 }, 3: { f: 3200, g: 3 }, 4: { f: 10000, g: 3 } },
  'Warm': { 1: { g: 3, f: 150 }, 4: { g: -4, f: 6000 } },
  'Hell & luftig': { 0: { on: true, f: 60 }, 4: { g: 5, f: 10000 } },
  'Weniger Dröhnen': { 2: { f: 280, g: -6, q: 1.6 } },
  'Telefon': { 0: { on: true, f: 400 }, 3: { f: 1500, g: 6, q: .8 }, 5: { on: true, f: 3200 } },
  'Lo-Fi': { 0: { on: true, f: 150 }, 5: { on: true, f: 4000 }, 2: { f: 1000, g: 3 } }

const isCut = b => b.type === 'highpass' || b.type === 'lowpass';
const eqActive = tr => !!tr.eq && tr.eq.on && tr.eq.bands.some(b => b.on && (isCut(b) || Math.abs(b.g || 0) > .1));
const fmtF = f => f >= 1000 ? (f / 1000).toFixed(f >= 10000 ? 0 : 1).replace('.', ',') + ' kHz' : Math.round(f) + ' Hz';
const fmtG = g => (g > 0 ? '+' : '') + g.toFixed(1).replace('.', ',') + ' dB';
function renderEq(tr) {
  ensureCtx();
  const eq = eqOf(tr), c = chan(tr);
  applyEq(tr, true);
  eHead.innerHTML = `<span class="note" style="color:${tr.color};font-weight:600">${esc(tr.name)}</span>
    <label class="note"><input type="checkbox" id="eqOn" ${eq.on ? 'checked' : ''}> EQ an</label>
    <label class="note">Vorlage <select id="eqPre"><option value="">Wählen …</option>${Object.keys(EQ_PRESETS).map(k => `<option>${k}</option>`).join('')}</select></label>
    <span class="note">Punkte ziehen · Mausrad = Bandbreite · Doppelklick = Band an/aus</span>`;
  eBody.innerHTML = `<div class="eq"><div class="eq-graph"><canvas id="eqcv"></canvas></div><div class="eq-bands" id="eqBands"></div></div>`;
  const cv = $('#eqcv'), box = cv.parentElement, N = 256;
  const freqs = new Float32Array(N).map((_, i) => 20 * Math.pow(1000, i / (N - 1)));
  const mag = new Float32Array(N), ph = new Float32Array(N), spec = new Float32Array(c.an.frequencyBinCount);
  const RANGE = 18;
  let W = 0, H = 0;
  const fx = f => W * Math.log(f / 20) / Math.log(1000), xf = x => clamp(20 * Math.pow(1000, x / W), 20, 20000);
  const gy = g => H / 2 - g / RANGE * (H / 2 - 12), yg = y => clamp((H / 2 - y) / (H / 2 - 12) * RANGE, -RANGE, RANGE);
  const handle = b => ({ x: fx(b.f), y: isCut(b) ? H / 2 : gy(b.g || 0) });
  function bandsList() {
    $('#eqBands').innerHTML = eq.bands.map((b, i) => `<label class="band ${b.on && eq.on ? '' : 'off'}" style="--bc:${EQ_COLORS[i]}"><input type="checkbox" data-band="${i}" ${b.on ? 'checked' : ''}><b style="color:${EQ_COLORS[i]}">${EQ_NAMES[i]}</b><span>${fmtF(b.f)}${isCut(b) ? '' : ' · ' + fmtG(b.g || 0)}</span></label>`).join('');
  }
  function draw() {
    const dpr = devicePixelRatio || 1;

    if (!W || !H) return;
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    g.font = '10px ' + getComputedStyle(document.body).fontFamily; g.fillStyle = '#6f7480';
    for (const f of [50, 100, 200, 500, 1000, 2000, 5000, 10000]) { const x = fx(f); g.fillRect(x, 0, 1, H); g.fillText(fmtF(f), x + 3, H - 4); }
    for (const db of [-12, -6, 6, 12]) { const y = gy(db); g.fillRect(0, y, W, 1); g.fillText((db > 0 ? '+' : '') + db, 4, y - 3); }
    g.fillStyle = '#8a8f9c'; g.fillRect(0, H / 2, W, 1);

      const bin = Math.min(spec.length - 1, Math.round(xf(x) / (ctx.sampleRate / 2) * spec.length));

    c.bands.forEach(f => { f.getFrequencyResponse(freqs, mag, ph); for (let i = 0; i < N; i++) tot[i] *= mag[i]; });
    const pts = Array.from(tot, (m, i) => [fx(freqs[i]), gy(clamp(20 * Math.log10(m), -RANGE - 6, RANGE + 6))]);
    g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y));
    g.lineTo(W, H / 2); g.lineTo(0, H / 2); g.closePath();
    g.fillStyle = eq.on ? 'rgba(242,184,75,.16)' : 'rgba(140,140,140,.08)'; g.fill();
    g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y));
    g.strokeStyle = eq.on ? '#f2b84b' : '#777'; g.lineWidth = 2; g.stroke();
    eq.bands.forEach((b, i) => {
      const { x, y } = handle(b);
      g.beginPath(); g.arc(x, y, 7, 0, Math.PI * 2);
      if (b.on && eq.on) { g.fillStyle = EQ_COLORS[i]; g.fill(); } else { g.strokeStyle = EQ_COLORS[i]; g.lineWidth = 1.5; g.stroke(); }
    });
  }
  const pick = (x, y) => { let best = -1, bd = 18; eq.bands.forEach((b, i) => { const h = handle(b), d = Math.hypot(h.x - x, h.y - y); if (d < bd) { bd = d; best = i; } }); return best; };
  const changed = () => { applyEq(tr, true); bandsList(); draw(); };
  const commit = () => { save(); rowsEl.querySelector(`.track-row[data-track="${tr.id}"] .eqb`)?.classList.toggle('on', eqActive(tr)); };
  cv.onpointerdown = e => {

    const r = cv.getBoundingClientRect(), i = pick(e.clientX - r.left, e.clientY - r.top); if (i < 0) return;

  $('#eqOn').onchange = e => { pushUndo(); eq.on = e.target.checked; changed(); commit(); };
  $('#eqPre').onchange = e => {
    const p = EQ_PRESETS[e.target.value]; if (!p) return;
    pushUndo(); const d = defaultEq(); d.bands.forEach((b, i) => Object.assign(b, p[i] || {}));
    tr.eq = d; commit(); renderEditor();
  };
  bandsList();
  requestAnimationFrame(draw);
  eqView = { tr, draw };
}

function renderPianoRoll(tr, r) {
  const rows = PR.hi - PR.lo + 1, steps = Math.ceil(r.len * 4), W = steps * PR.sw, H = rows * PR.rh;
  let keys = '';
  for (let m = PR.hi; m >= PR.lo; m--) { const bl = [1, 3, 6, 8, 10].includes(m % 12); keys += `<div class="key ${bl ? 'black' : ''}" data-p="${m}">${m % 12 === 0 ? noteName(m) : ''}</div>`; }
  eBody.innerHTML = `<div class="pr" id="pr"><div class="pr-keys" style="height:${H}px">${keys}</div>
    <div class="pr-grid" id="prgrid" style="width:${W}px;height:${H}px"><canvas id="prbg"></canvas><div id="prnotes"></div><div class="ed-play" id="edplay"></div></div></div>`;
  const cv = $('#prbg'), dpr = devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  for (let m = PR.hi; m >= PR.lo; m--) {
    const y = (PR.hi - m) * PR.rh;
    g.fillStyle = [1, 3, 6, 8, 10].includes(m % 12) ? '#1d1e23' : '#25272e'; g.fillRect(0, y, W, PR.rh);
    g.fillStyle = m % 12 === 0 ? '#3d404b' : '#1a1b20'; g.fillRect(0, y + PR.rh - 1, W, 1);
  }
  for (let k = 0; k <= steps; k++) { g.fillStyle = k % 16 === 0 ? '#5b5f6d' : k % 4 === 0 ? '#3a3d47' : '#2a2c33'; g.fillRect(k * PR.sw, 0, 1, H); }
  drawNotes(r);
  const pr = $('#pr');
  const ps = r.notes.length ? r.notes.reduce((a, n) => a + n.p, 0) / r.notes.length : 62;
  pr.scrollTop = (PR.hi - ps) * PR.rh - pr.clientHeight / 2;
  pr.querySelector('.pr-keys').onpointerdown = e => { const k = e.target.closest('.key'); if (k) previewNote(tr, +k.dataset.p); };
  const grid = $('#prgrid');
  grid.oncontextmenu = e => {
    e.preventDefault();
    const el = e.target.closest('.nt'); if (!el) return;
    pushUndo(); r.notes.splice(+el.dataset.i, 1); selNote = null; drawNotes(r); save(); renderArrange();
  };
  grid.onpointerdown = e => {
    if (e.button !== 0) return;
    focusArea = 'pr';
    const rect = grid.getBoundingClientRect(), x = e.clientX - rect.left, y = e.clientY - rect.top;
    const el = e.target.closest('.nt');
    pushUndo();
    let n, mode;
    if (el) {
      n = r.notes[+el.dataset.i];
      if (e.altKey) { r.notes.splice(+el.dataset.i, 1); selNote = null; drawNotes(r); save(); renderArrange(); return; }
      mode = x > (n.s + n.l) * 4 * PR.sw - 7 ? 'resize' : 'move';
    } else {
      const step = Math.floor(x / PR.sw);
      n = { p: clamp(PR.hi - Math.floor(y / PR.rh), PR.lo, PR.hi), s: step / 4, l: Math.min(lastLen, r.len - step / 4), v: .8 };
      r.notes.push(n); mode = 'move';
    }
    selNote = n; drawNotes(r); previewNote(tr, n.p);
    const st = { x, y, s: n.s, p: n.p, l: n.l };
    grid.setPointerCapture(e.pointerId);
    grid.onpointermove = ev => {
      const x2 = ev.clientX - rect.left, y2 = ev.clientY - rect.top, ds = Math.round((x2 - st.x) / PR.sw) / 4;
      if (mode === 'resize') n.l = clamp(st.l + ds, .25, r.len - n.s);
      else {
        n.s = clamp(st.s + ds, 0, r.len - .25);
        const p = clamp(st.p - Math.round((y2 - st.y) / PR.rh), PR.lo, PR.hi);
        if (p !== n.p) { n.p = p; previewNote(tr, p); }
      }
      drawNotes(r);
    };
    grid.onpointerup = () => { grid.onpointermove = null; lastLen = n.l; save(); renderArrange(); };
  };
  $('#quant').onclick = () => { pushUndo(); r.notes.forEach(n => { n.s = Math.round(n.s * 4) / 4; n.l = Math.max(.25, Math.round(n.l * 4) / 4); }); drawNotes(r); save(); renderArrange(); };
  $('#trUp').onclick = () => { pushUndo(); r.notes.forEach(n => n.p = clamp(n.p + 12, 0, 127)); drawNotes(r); save(); renderArrange(); };
  $('#trDown').onclick = () => { pushUndo(); r.notes.forEach(n => n.p = clamp(n.p - 12, 0, 127)); drawNotes(r); save(); renderArrange(); };
}
function drawNotes(r) {
  const box = $('#prnotes'); if (!box) return;

    `<div class="nt ${n === selNote ? 'sel' : ''}" data-i="${i}" title="${noteName(n.p)}" style="left:${n.s * 4 * PR.sw}px;top:${(PR.hi - n.p) * PR.rh}px;width:${Math.max(6, n.l * 4 * PR.sw)}px;opacity:${.55 + n.v * .45}"></div>`).join('');
}
function previewNote(tr, p) {

}

function renderSteps(tr, r) {

    ${DRUMS.map(d => `<div class="seq-row"><button class="seq-name" data-d="${d.id}" title="Taste ${d.key}">${d.name}</button><div class="cells">${(r.steps[d.id] || []).map((v, k) =>
      `<button class="cell ${Math.floor(k / 4) % 2 ? 'q' : ''} ${v ? 'on' : ''} ${v === 2 ? 'acc' : ''}" data-d="${d.id}" data-k="${k}" aria-label="${d.name} Schritt ${k + 1}"></button>`).join('')}</div></div>`).join('')}</div>`;
  liveCells = { r, cols: Array.from({ length: 16 }, (_, k) => [...eBody.querySelectorAll(`.cell[data-k="${k}"]`)]), last: -1 };

  $('#patsel').onchange = e => {

function regionDrag(e, el) {
  if (e.button !== 0) return;
  const [tr, r] = findRegion(el.dataset.region);
  focusArea = 'arr';
  const changed = selRegion !== r.id || edTab !== 'region';
  selTrack = tr.id; selRegion = r.id; edTab = 'region'; markSelection(); if (changed) renderEditor();
  const resize = e.target.classList.contains('rh');
  const x0 = e.clientX, s0 = r.start, l0 = r.len, snap = ppb < 18 ? 4 : 1;
  let moved = false;
  el.setPointerCapture(e.pointerId);
  el.onpointermove = ev => {
    if (!moved && Math.abs(ev.clientX - x0) < 4) return;
    if (!moved) { pushUndo(); moved = true; }
    const db = (ev.clientX - x0) / ppb;
    if (resize) r.len = Math.max(snap, Math.round((l0 + db) / snap) * snap);
    else r.start = Math.max(0, Math.round((s0 + db) / snap) * snap);
    el.style.left = r.start * ppb + 'px'; el.style.width = r.len * ppb + 'px';
  };
  el.onpointerup = ev => {
    el.onpointermove = el.onpointerup = null;
    if (!moved) return;
    if (!resize) {
      const lane = document.elementsFromPoint(ev.clientX, ev.clientY).find(n => n.classList?.contains('lane'));
      const t2 = lane && findTrack(lane.dataset.track);
      if (t2 && t2 !== tr && t2.type === tr.type) { tr.regions.splice(tr.regions.indexOf(r), 1); t2.regions.push(r); selTrack = t2.id; }
    }
    save(); render();
  };
}

    const x = ev.clientX - rect.left;

    const a = Math.floor(Math.min(b0, x / ppb) / 4) * 4, b = Math.ceil(Math.max(b0, x / ppb) / 4) * 4;

  rulerEl.onpointerup = () => {

    if (dragging) { save(); return; }

  };
});

async function importFile(file, trackId, beat) {
  ensureCtx();
  let buf;
  try { buf = await ctx.decodeAudioData(await file.arrayBuffer()); }
  catch (e) { toast(`„${file.name}“ ist keine lesbare Audiodatei.`); return; }
  pushUndo();
  let tr = trackId && findTrack(trackId);
  if (!tr || tr.type !== 'audio') { const s = findTrack(selTrack); tr = s && s.type === 'audio' && !trackId ? s : null; }
  if (!tr) { tr = newTrack('audio', { name: file.name.replace(/\.[^.]+$/, '').slice(0, 24) }); P.tracks.push(tr); applyMix(); }
  const id = addBuffer(buf);
  const start = beat ?? Math.floor(playPos);
  const r = { id: uid(), name: file.name.replace(/\.[^.]+$/, ''), start, len: buf.duration / spb(), buf: id, offset: 0 };
  tr.regions.push(r); selTrack = tr.id; selRegion = r.id; save(); render();
}

  importFile(f, lane?.dataset.track || '__new', beat);
});

// Tastatur: Shortcuts und Musical Typing (physische Tastenpositionen, funktioniert auch mit QWERTZ)
const TYPING = { KeyA: 0, KeyW: 1, KeyS: 2, KeyE: 3, KeyD: 4, KeyF: 5, KeyT: 6, KeyG: 7, KeyY: 8, KeyH: 9, KeyU: 10, KeyJ: 11, KeyK: 12, KeyO: 13, KeyL: 14, KeyP: 15, Semicolon: 16 };
const DRUMKEYS = { KeyA: 0, KeyS: 1, KeyD: 2, KeyF: 3, KeyG: 4, KeyH: 5, KeyJ: 6, KeyK: 7 };
let octave = 60;
const held = new Map();
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyS') { e.preventDefault(); saveProject(e.shiftKey); return; }
  if (e.target.closest('input:not([type=range]),select,textarea')) return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.code === 'KeyZ') { e.preventDefault(); undo(); return; }
  if (mod && e.code === 'KeyD') { e.preventDefault(); duplicateRegion(); return; }
  if (mod && e.code === 'KeyS') { e.preventDefault(); saveProject(e.shiftKey); return; }
  if (mod && e.code === 'KeyO') { e.preventDefault(); openProject(); return; }
  if (mod) return;
  if (e.code === 'Space') { e.preventDefault(); playing ? stop() : play(); return; }
  if (e.code === 'Enter') { $('#bStart').click(); return; }
  if (e.code === 'KeyR' && !e.repeat) { toggleRecord(); return; }
  if (e.code === 'KeyC' && !e.repeat) { $('#bLoop').click(); return; }
  if (e.code === 'Delete' || e.code === 'Backspace') { e.preventDefault(); deleteSelection(); return; }
  if (e.code === 'KeyZ') { octave = Math.max(24, octave - 12); toast('Oktave ' + noteName(octave)); return; }
  if (e.code === 'KeyX') { octave = Math.min(96, octave + 12); toast('Oktave ' + noteName(octave)); return; }
  if (e.repeat) return;
  const tr = findTrack(selTrack); if (!tr) return;
  if (tr.type === 'synth' && e.code in TYPING) liveNoteOn(e.code, octave + TYPING[e.code], .85);
  else if (tr.type === 'drums' && e.code in DRUMKEYS) liveNoteOn(e.code, 36 + DRUMKEYS[e.code], .9);
});
document.addEventListener('keyup', e => liveNoteOff(e.code));
window.addEventListener('blur', () => { [...held.keys()].forEach(liveNoteOff); });

// Live spielen: Computertastatur und MIDI-Keyboard teilen sich diesen Weg.
// Auf Drum-Spuren steuern die Noten ab C1 (MIDI 36) die Kit-Sounds an (General-MIDI-ähnlich).
const GM_DRUMS = { 35: 'kick', 36: 'kick', 37: 'rim', 38: 'snare', 39: 'clap', 40: 'snare', 41: 'tom', 42: 'hat', 43: 'tom', 44: 'hat', 45: 'tom', 46: 'ohat', 47: 'tom', 56: 'cow' };
function liveNoteOn(id, midi, vel) {
  const tr = findTrack(selTrack); if (!tr || held.has(id)) return;
  ensureCtx();
  if (tr.type === 'synth') {
    held.set(id, { v: noteOn(tr, chan(tr).input, midi, ctx.currentTime, vel), midi });
    if (rec && rec.type === 'midi' && rec.track === tr.id && playing) recNoteStart(id, midi, vel);
    eBody.querySelector(`.key[data-p="${midi}"]`)?.classList.add('down');
  } else if (tr.type === 'drums') {
    const d = id.startsWith('midi') ? GM_DRUMS[midi] : DRUMS[midi - 36]?.id;
    if (d) playDrum(d, chan(tr).input, ctx.currentTime, vel, tr.kit);
  }
}
function liveNoteOff(id) {
  const h = held.get(id); if (!h) return;
  held.delete(id); h.v.release(ctx.currentTime);
  if (rec && rec.type === 'midi') endRecNote(rec, id);
  eBody.querySelector(`.key[data-p="${h.midi}"]`)?.classList.remove('down');
}

// ================= Externe Geräte =================
let midiAccess = null, inputDevice = '';
const devMenu = $('#devMenu');
$('#bDev').onclick = e => { e.stopPropagation(); devMenu.hidden = !devMenu.hidden; };
devMenu.onclick = e => e.stopPropagation();
async function connectMidi(quiet) {
  if (!navigator.requestMIDIAccess) { if (!quiet) toast('Dieser Browser unterstützt kein MIDI. In der Windows-App und in Chrome/Edge geht es.'); return; }
  try { midiAccess = await navigator.requestMIDIAccess(); }
  catch (e) { if (!quiet) toast('MIDI-Zugriff wurde nicht erlaubt.'); return; }
  const bind = () => {
    const names = [];
    midiAccess.inputs.forEach(inp => { inp.onmidimessage = onMidi; names.push(inp.name); });
    $('#midiList').innerHTML = names.length ? names.map(n => `<span>${esc(n)}</span>`).join('') : 'Kein MIDI-Gerät gefunden. Schließe ein Keyboard per USB an.';
    $('#midiDot').classList.toggle('on', names.length > 0);
  };
  midiAccess.onstatechange = bind; bind();
}
function onMidi(e) {
  const [st, d1, d2] = e.data, cmd = st & 0xf0;
  if (cmd === 0x90 && d2 > 0) liveNoteOn('midi' + d1, d1, .3 + d2 / 127 * .7);
  else if (cmd === 0x80 || (cmd === 0x90 && d2 === 0)) liveNoteOff('midi' + d1);
}
$('#bMidi').onclick = () => connectMidi(false);
async function scanInputs() {
  try {
    if (!navigator.mediaDevices?.enumerateDevices) throw 0;
    let devs = await navigator.mediaDevices.enumerateDevices();
    if (devs.some(d => d.kind === 'audioinput' && !d.label)) {
      const s = await navigator.mediaDevices.getUserMedia({ audio: true }); s.getTracks().forEach(t => t.stop());
      devs = await navigator.mediaDevices.enumerateDevices();
    }
    const ins = devs.filter(d => d.kind === 'audioinput');
    $('#inSel').innerHTML = '<option value="">Standardgerät</option>' + ins.map(d => `<option value="${esc(d.deviceId)}" ${d.deviceId === inputDevice ? 'selected' : ''}>${esc(d.label || 'Eingang')}</option>`).join('');
  } catch (e) { toast('Kein Zugriff auf Audio-Eingänge. Erlaube das Mikrofon.'); }
}
$('#bInScan').onclick = scanInputs;
$('#inSel').onchange = e => { inputDevice = e.target.value; };
// In der Windows-App ist MIDI ohne Rückfrage verfügbar, also gleich verbinden.
if (navigator.userAgent.includes('Electron')) connectMidi(true);
function deleteSelection() {
  const [tr, r] = findRegion(selRegion); if (!r) return;
  pushUndo();
  if (focusArea === 'pr' && selNote && r.notes) { r.notes = r.notes.filter(n => n !== selNote); selNote = null; drawNotes(r); save(); renderArrange(); return; }
  tr.regions = tr.regions.filter(x => x !== r); selRegion = null; save(); render();
}
function duplicateRegion() {
  const [tr, r] = findRegion(selRegion); if (!r) return;
  pushUndo();
  const c = JSON.parse(JSON.stringify(r)); c.id = uid(); c.start = r.start + Math.ceil(r.len / 4) * 4;
  tr.regions.push(c); selRegion = c.id; save(); render();
}

let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

// Animationsschleife: Playhead, Anzeige, Pegel, aktueller Step
const meterEl = $('#meter'), tbuf = new Float32Array(1024);
function frame() {
  if (playing) {
    const b = currentBeat();
    updatePlayhead();
    if (!P.loop.on && !rec && b >= songLen()) { stop(); playPos = 0; updatePlayhead(); }
    if (rec && b > P.bars * 4 - 8) { P.bars += 8; renderArrange(); }
    updateGhost();
    const sc = $('#scroller'), x = hw() + b * ppb;
    if (x > sc.scrollLeft + sc.clientWidth - 40 || x < sc.scrollLeft + hw()) sc.scrollLeft = x - hw() - 40;
    if (liveCells) {
      const r = liveCells.r, k = b >= r.start && b < r.start + r.len ? Math.floor((b - r.start) * 4) % 16 : -1;
      if (k !== liveCells.last) {
        liveCells.cols[liveCells.last]?.forEach(c => c.classList.remove('now'));
        liveCells.cols[k]?.forEach(c => c.classList.add('now')); liveCells.last = k;
      }
    }
    const [, er] = findRegion(selRegion), ep = $('#edplay');
    if (ep && er) { const rel = b - er.start; ep.style.display = rel >= 0 && rel <= er.len ? '' : 'none'; ep.style.left = rel * 4 * PR.sw + 'px'; }
  } else if (liveCells && liveCells.last !== -1) { liveCells.cols[liveCells.last]?.forEach(c => c.classList.remove('now')); liveCells.last = -1; }
  if (eqView && (playing || edTab === 'fx')) eqView.draw();
  if (analyser) {
    analyser.getFloatTimeDomainData(tbuf);
    let pk = 0; for (let i = 0; i < tbuf.length; i++) pk = Math.max(pk, Math.abs(tbuf[i]));
    meterEl.style.width = Math.min(100, pk * 100) + '%';
  }
  requestAnimationFrame(frame);
}

window.addEventListener('resize', () => renderArrange());
P = load();
P.loop ||= { on: false, start: 0, end: 16 };
P.name ||= 'Mein Song';
selTrack = P.tracks[0]?.id || null;
render(); dirty = false; updateTitle();
restoreBuffers().then(() => { if (bufferIds().length) render(); });
requestAnimationFrame(frame);
})();
</script>
