<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Sound Groot</title>
<style>
/* Startfenster der Windows-App (640 × 400, ohne Rahmen), solange das Hauptfenster lädt */
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-app-region: drag; }
.win { box-sizing: border-box; height: 100%; background: #0f1014; color: #eceef3; font-family: "Inter", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; border: 1px solid #2b2f38; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
.main { flex: 1; display: flex; align-items: center; gap: 28px; padding: 0 56px; }
.icon { width: 120px; height: 120px; border-radius: 28px; background: #15171c; border: 1px solid #2b2f38; display: grid; place-items: center; flex: none; animation: breathe 2.6s cubic-bezier(.2, .8, .2, 1) infinite; }
h1 { margin: 0; font-size: 40px; font-weight: 400; letter-spacing: -.03em; line-height: 1; white-space: nowrap; } h1 b { font-weight: 600; }
p { margin: 8px 0 0; font-size: 14px; color: #8b91a1; }
.foot { padding: 0 56px 32px; display: flex; flex-direction: column; gap: 12px; }
.bar { height: 3px; border-radius: 2px; background: #252931; overflow: hidden; }
.bar i { display: block; height: 100%; width: 8%; border-radius: 2px; background: linear-gradient(90deg, #ff5a52, #f2d64b, #45c776, #5aa0ff, #9b7bff); transition: width .7s cubic-bezier(.2, .8, .2, 1); }
.row { display: flex; justify-content: space-between; font-size: 12px; color: #8b91a1; }
.row span:last-child { font-family: "JetBrains Mono", "Cascadia Mono", Consolas, monospace; }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
</style>
</head>
<body>
<div class="win">
  <div class="main">
    <div class="icon"><svg width="100" height="100" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" color="#eceef3"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.1"><path d="M21.5 27.6 C19.5 26.8 18 26.3 16 25"></path><path d="M22.5 27.8 C21.5 26.5 20.8 25.6 20 23.5"></path><path d="M23.5 28.3 C24.5 27.4 25.5 26.6 28 25"></path><path d="M42.6 22 C41.5 20.8 40.6 20 39.5 18"></path><path d="M42.8 21.8 C43 20.6 43.4 19.6 44 16"></path><path d="M42 23 C44 22 46 21.4 48 20"></path></g><path d="M31 34.5 C27.5 31.8 24.5 30.2 21 28.6 L21.6 27.2 C25 28.5 28.2 29.8 31.6 31.6 Z" fill="currentColor"></path><path d="M32 32.5 C35.5 29.2 38.8 25.8 42.2 21.6 L43.2 22.4 C40.4 26.4 37.6 30.4 34.6 34 Z" fill="currentColor"></path><rect x="10.5" y="20" width="3" height="6" rx="1.5" fill="#ff5a52"></rect><rect x="14.5" y="17" width="3" height="12" rx="1.5" fill="#ff7a45"></rect><rect x="18.5" y="14.5" width="3" height="17" rx="1.5" fill="#ff9a3c"></rect><rect x="22.5" y="16.5" width="3" height="13" rx="1.5" fill="#f7c043"></rect><rect x="26.5" y="20" width="3" height="6" rx="1.5" fill="#f2d64b"></rect><rect x="34.5" y="12" width="3" height="7" rx="1.5" fill="#a6d45a"></rect><rect x="38.5" y="8" width="3" height="15" rx="1.5" fill="#45c776"></rect><rect x="42.5" y="4.5" width="3" height="22" rx="1.5" fill="#48b5c9"></rect><rect x="46.5" y="7.5" width="3" height="16" rx="1.5" fill="#5aa0ff"></rect><rect x="50.5" y="11" width="3" height="9" rx="1.5" fill="#9b7bff"></rect><path d="M25 48 C24 45 27.5 43.5 26.5 40 C25.5 36.5 27 33.5 30 31.5 C31.5 30.5 33.5 30.5 35 31 C35.5 33 34 35 35 38 C36.5 42 34 45 35.5 48 Z" fill="currentColor"></path><path d="M34.2 40.5 C37.5 41.5 39.2 44.5 39.2 47.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"></path><path d="M11.5 47 H52.5 C53.3 47 53.8 47.7 53.5 48.4 L50.2 56 C49.7 57.2 48.6 58 47.3 58 H16.7 C15.4 58 14.3 57.2 13.8 56 L10.5 48.4 C10.2 47.7 10.7 47 11.5 47 Z" fill="currentColor"></path></svg></div>
    <div><h1><b>Sound</b> Groot</h1><p>Aus einem Ton wächst ein Song</p></div>
  </div>
  <div class="foot">
    <div class="bar"><i id="fill"></i></div>
    <div class="row"><span id="msg">Starte Audio-Engine …</span><span id="ver"></span></div>
  </div>
</div>
<script>
const steps = [['Starte Audio-Engine …', 18], ['Lade Instrumente …', 42], ['Lade Schlagzeug-Kits …', 64], ['Suche MIDI-Geräte und Mikrofone …', 82], ['Öffne letztes Projekt …', 94]];
let i = 0;
const show = () => { const [m, p] = steps[Math.min(i++, steps.length - 1)]; document.getElementById('msg').textContent = m; document.getElementById('fill').style.width = p + '%'; };
requestAnimationFrame(show); setInterval(show, 380);
const v = new URLSearchParams(location.search).get('v'); if (v) document.getElementById('ver').textContent = 'v' + v;
</script>
</body>
</html>
